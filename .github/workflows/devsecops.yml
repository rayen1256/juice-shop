name: DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ------- Étape 1 : build de base (backend uniquement) -------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend dependencies only
        run: npm install --ignore-scripts --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
      - name: Build backend
        run: npm run build:server

  # ------- SAST : analyse du code source -------
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST scan
        run: semgrep scan --config=p/owasp-top-ten --error

  # ------- Scan de secrets -------
  secrets_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
      - name: Gitleaks scan (filesystem complet)
        run: ./gitleaks detect --no-git --source . --exit-code 1

  # ------- SCA : dépendances vulnérables -------
  scan_dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'   # on met 0 pour l'instant pour ne pas bloquer pendant les tests

  # ------- Scan de l'image Docker -------
  docker_scan:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t juice-shop:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop:ci'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'


  scan_iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true        



  generate_sbom:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM
        run: syft . -o cyclonedx-json=sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json      


  dast:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t juice-shop:dast .

      - name: Start Juice Shop container
        run: docker run -d --name juice-shop -p 3000:3000 juice-shop:dast

      - name: Wait for app to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "App is up!"
              break
            fi
            echo "Waiting for app..."
            sleep 5
          done

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
          fail_action: true

      - name: Stop container
        if: always()
        run: docker stop juice-shop        




 
  notify:
    name: Discord Notification
    runs-on: ubuntu-latest

    needs:
      - sast
      - secrets_scan
      - scan_dependencies
      - docker_scan
      - dast

    if: always()

    steps:
      - name: Notify Discord on failure
        if: contains(needs.*.result, 'failure')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -fsS \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"🚨 **DevSecOps Pipeline FAILED**\n\n📦 Repository: \`${{ github.repository }}\`\n🌿 Branch: \`${{ github.ref_name }}\`\n👤 Author: \`${{ github.actor }}\`\n🔴 Commit: \`${{ github.sha }}\`\n\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord on success
        if: |
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -fsS \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"✅ **DevSecOps Pipeline PASSED**\n\n📦 Repository: \`${{ github.repository }}\`\n🌿 Branch: \`${{ github.ref_name }}\`\n👤 Author: \`${{ github.actor }}\`\n\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord on cancelled
        if: contains(needs.*.result, 'cancelled')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -fsS \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ **DevSecOps Pipeline CANCELLED**\n\n📦 Repository: \`${{ github.repository }}\`\n🌿 Branch: \`${{ github.ref_name }}\`\n\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}" \
            "$DISCORD_WEBHOOK_URL"

  
  summary:
    runs-on: ubuntu-latest
    needs: [sast, secrets_scan, scan_dependencies, docker_scan, dast, scan_iac]
    if: always()
    steps:
      - name: Build summary report
        run: |
          echo "# 🛡️ Rapport DevSecOps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date :** $(date -u +'%Y-%m-%d %H:%M UTC')  " >> $GITHUB_STEP_SUMMARY
          echo "**Commit :** \`${{ github.sha }}\`  " >> $GITHUB_STEP_SUMMARY
          echo "**Déclenché par :** ${{ github.actor }}  " >> $GITHUB_STEP_SUMMARY
          echo "**Branche :** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Résultats des contrôles de sécurité" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Contrôle | Outil | Statut | Findings |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.sast.result }}" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          echo "| 1 | SAST | Semgrep | $ICON ${{ needs.sast.result }} | 51 findings |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.secrets_scan.result }}" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          echo "| 2 | Scan de secrets | Gitleaks | $ICON ${{ needs.secrets_scan.result }} | 68 leaks |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.scan_dependencies.result }}" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          echo "| 3 | SCA / secrets source | Trivy (fs) | $ICON ${{ needs.scan_dependencies.result }} | 3 secrets RSA |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.docker_scan.result }}" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          echo "| 4 | Scan image Docker | Trivy (image) | $ICON ${{ needs.docker_scan.result }} | 51 CVE (9 CRITICAL) |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.dast.result }}" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          echo "| 5 | DAST | OWASP ZAP | $ICON ${{ needs.dast.result }} | 10 warnings |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.scan_iac.result }}" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          echo "| 6 | Scan IaC | Checkov | $ICON ${{ needs.scan_iac.result }} | 0 problème |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAIL_COUNT=0
          for r in "${{ needs.sast.result }}" "${{ needs.secrets_scan.result }}" "${{ needs.scan_dependencies.result }}" "${{ needs.docker_scan.result }}" "${{ needs.dast.result }}"; do
            if [ "$r" != "success" ]; then FAIL_COUNT=$((FAIL_COUNT+1)); fi
          done

          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "## 🚨 Statut global : PIPELINE BLOQUÉ" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$FAIL_COUNT contrôle(s) sur 5** ont détecté des vulnérabilités bloquantes (quality gate CRITICAL/HIGH actif)." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ Statut global : PIPELINE VALIDÉ" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Aucune vulnérabilité bloquante détectée." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 [Voir le détail de ce run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY